name: Generate Admin Password Hash

on:
  workflow_dispatch:

jobs:
  hash-password:
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install bcryptjs
        run: npm install bcryptjs --no-save

      - name: Generate bcrypt hash
        run: |
          node <<'NODE'
          const { hash } = require('bcryptjs');

          async function main() {
            const password = process.env.ADMIN_PASSWORD;
            if (!password) {
              console.error('ADMIN_PASSWORD secret is missing');
              process.exit(1);
            }

            if (password.length < 12) {
              console.error('ADMIN_PASSWORD must be at least 12 characters');
              process.exit(1);
            }

            const digest = await hash(password, 12);
            console.log('ADMIN_BCRYPT_HASH=' + digest);
          }

          main();
          NODE
