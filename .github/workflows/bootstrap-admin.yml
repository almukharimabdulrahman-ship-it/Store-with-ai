name: Bootstrap Admin Account

on:
  workflow_dispatch:

jobs:
  bootstrap-admin:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_EMAIL: almukharimabdulrahman@gmail.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Create or update administrator
        run: |
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const { hash } = require('bcryptjs');

          async function main() {
            const email = process.env.ADMIN_EMAIL;
            const password = process.env.ADMIN_PASSWORD;
            if (!password || password.length < 12) {
              throw new Error('ADMIN_PASSWORD is missing or shorter than 12 characters');
            }

            const prisma = new PrismaClient();
            try {
              const passwordHash = await hash(password, 12);
              const role = await prisma.role.upsert({
                where: { code: 'ADMIN' },
                update: { name: 'Administrator' },
                create: { code: 'ADMIN', name: 'Administrator', description: 'Store administrator' },
              });

              await prisma.user.upsert({
                where: { email },
                update: { roleId: role.id, passwordHash },
                create: { email, name: 'Administrator', roleId: role.id, passwordHash },
              });

              console.log('Administrator account is ready.');
            } finally {
              await prisma.$disconnect();
            }
          }

          main().catch((error) => {
            console.error('Admin bootstrap failed:', error?.code || error?.name || 'UNKNOWN_ERROR');
            process.exit(1);
          });
          NODE
